[project]
name = "panov"
dynamic = ["version"]
authors = [{name = "offa"}]
description = "Viewer for 360° equirectangular panoramas."
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.12.0,<7",
    "numpy>=2.5.4,<2.6",
]
keywords = ["panorama", "360", "equirectangular", "viewer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

[project.scripts]
panov = "panov.cli:main"

[project.urls]
Homepage = "https://github.com/offa/panov"
Source = "https://github.com/offa/panov"

[project.optional-dependencies]
dev = [
    "pylint==4.1.3",
    "pyrefly==1.4.1",
    "ruff==0.17.4",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "panov.__version__"}

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
extend-select = ["E501"]
